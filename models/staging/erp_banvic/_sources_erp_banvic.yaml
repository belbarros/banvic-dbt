sources:
  - name: erp
    description: Sistema ERP da Banvic, com dados de clientes, colaboradores, contas e transações.
    database: dev
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informações de cidade e estado.
        columns:
          - name: cod_localidade
            description: Chave primária da tabela localidades.
            data_tests:
              - unique
              - not_null
                            
      - name: clientes
        description: Tabela fonte de clientes com informações pessoais de cada cliente.
        columns:
          - name: cod_cliente
            description: Chave primária da tabela clientes.
            data_tests:
              - unique
              - not_null
        
      - name: agencias
        description: Tabela fonte de clientes com informações de agências do banco.
        columns:
          - name: cod_agencia
            description: Chave primária da tabela agencias.
            data_tests:
              - unique
              - not_null

      - name: colaboradores
        description: Tabela fonte de clientes com informações dos colaboradores do banco.
        columns:
          - name: cod_colaborador
            description: Chave primária da tabela colaboradores.
            data_tests:
              - unique
              - not_null

      - name: colaborador_agencia
        description: Tabela que relaciona os colaboradores com suas agências.